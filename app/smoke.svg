<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <filter id="smoke" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0042" numOctaves="4" seed="7" result="n"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.007" numOctaves="2" seed="3" result="w"/>
    <feDisplacementMap in="n" in2="w" scale="320" xChannelSelector="R" yChannelSelector="B" result="d"/>
    <feColorMatrix in="d" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.56  0 0 0 0 0.58  1 0 0 0 0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0 0 0 .03 .2 .03 0 0 .1 0 0 0"/>
    </feComponentTransfer>
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <rect width="100%" height="100%" fill="#fcfcfc"/>
  <rect width="100%" height="100%" filter="url(#smoke)"/>
</svg>
